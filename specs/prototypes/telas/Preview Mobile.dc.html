<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#20304F;font-family:'Manrope',system-ui,sans-serif}
  a{color:#C2A46A}
  a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height:100vh;padding:40px 40px 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C2A46A;font-weight:600">Checagem responsiva · 390 × 780</span>
    <h1 style="margin:0;font-weight:300;letter-spacing:-.03em;font-size:clamp(28px,4vw,40px);color:#fff">Todas as telas no mobile</h1>
    <p style="margin:0;font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.65);max-width:60ch">Cada moldura carrega o arquivo real em 390px de largura. Role dentro de cada uma para conferir o comportamento; a navegação entre telas funciona dentro da moldura.</p>
  </div>
  <div style="display:flex;gap:28px;overflow-x:auto;padding-bottom:16px">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="7">
      <div style="display:flex;flex-direction:column;gap:12px;flex:none">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
          <span style="font-size:13px;font-weight:600;color:#fff">{{ s.name }}</span>
          <span style="font-family:ui-monospace,monospace;font-size:10.5px;color:rgba(255,255,255,.5)">{{ s.file }}</span>
        </div>
        <div style="width:390px;height:780px;background:#fff;border:1px solid rgba(255,255,255,.18);overflow:hidden">
          <iframe src="{{ s.file }}" title="{{ s.name }}" style="width:390px;height:780px;border:0;display:block"></iframe>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    return { screens: [
      {name:'Login', file:'Login.dc.html'},
      {name:'Início', file:'Inicio.dc.html'},
      {name:'Minha inscrição', file:'Inscricao.dc.html'},
      {name:'Acompanhamento', file:'Acompanhamento.dc.html'},
      {name:'Cursos', file:'Cursos.dc.html'},
      {name:'Detalhe do curso', file:'Curso.dc.html'},
      {name:'Dúvidas frequentes', file:'Duvidas.dc.html'}
    ]};
  }
}
</script>
</body>
</html>
